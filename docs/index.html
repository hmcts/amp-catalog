<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>API Documentation</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.18.2/swagger-ui.css"
    />
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.18.2/swagger-ui-bundle.js"></script>
    <script>
      window.onload = () => {
        window.ui = SwaggerUIBundle({
          url: "openapi-spec.yml",
          dom_id: "#swagger-ui",
          deepLinking: true,
          // Stop-gap: docs-only. Try-It is disabled so no request ever reaches a
          // backend; OpenAPI `examples:` still render in the Example Value tab.
          tryItOutEnabled: false,
          supportedSubmitMethods: [],
        });
      };
    </script>
  </body>
</html>
