name: Publish Swagger UI to GitHub Pages

# Central, reusable workflow for the API Catalog stop-gap.
#
# An API repo publishes its docs by adding ONE small caller workflow:
#
#   jobs:
#     docs:
#       uses: hmcts/amp-catalog/.github/workflows/publish-swagger-ui.yml@v1
#       with:
#         openapi_path: src/main/resources/openapi/openapi-spec.yml
#
# This workflow checks out the caller, enables GitHub Pages, generates the
# Swagger UI viewer (docs-only — Try-It disabled) plus the spec, and deploys to
# the caller's https://hmcts.github.io/<repo>/ site. Nothing is committed back.
on:
  workflow_call:
    inputs:
      openapi_path:
        description: "Path to the OpenAPI spec file in the calling repo"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # On a release, publish the spec as it was at the released tag;
      # on manual runs, publish the current ref.
      - name: Checkout caller repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0 # tags are needed to resolve the release version below

      # The committed spec carries a placeholder version (e.g. 0.0.0) — the
      # real version is stamped at release time by hmcts/update-openapi-version
      # into the published artefact, never back into git. Mirror that here so
      # the docs site shows the released version and standard server URL.
      - name: Stamp release version into spec
        env:
          OPENAPI_PATH: ${{ inputs.openapi_path }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${RELEASE_TAG:-$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)}"
          if [ -z "$TAG" ]; then
            echo "No v* release tag found; publishing spec version as committed."
            exit 0
          fi
          VERSION="${TAG#v}"
          API_NAME="${GITHUB_REPOSITORY#*/}"
          yq -i "
            .info.version = \"$VERSION\" |
            .servers[0].url = \"https://$API_NAME.net/{version}\" |
            .servers[0].variables.version.default = \"$VERSION\" |
            .servers[0].variables.version.description = \"API version; matches the spec info.version\"
          " "$OPENAPI_PATH"
          echo "Stamped release version $VERSION (tag $TAG)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site
        env:
          OPENAPI_PATH: ${{ inputs.openapi_path }}
        run: |
          if [ ! -f "$OPENAPI_PATH" ]; then
            echo "::error::OpenAPI spec not found at '$OPENAPI_PATH'"
            exit 1
          fi
          mkdir -p _site
          cp "$OPENAPI_PATH" _site/openapi-spec.yml
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>API Documentation</title>
              <link
                rel="stylesheet"
                href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.18.2/swagger-ui.css"
              />
            </head>
            <body>
              <div id="swagger-ui"></div>
              <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.18.2/swagger-ui-bundle.js"></script>
              <script>
                window.onload = () => {
                  window.ui = SwaggerUIBundle({
                    url: "openapi-spec.yml",
                    dom_id: "#swagger-ui",
                    deepLinking: true,
                    // Stop-gap: docs-only. Try-It is disabled so no request
                    // ever reaches a backend; OpenAPI `examples:` still render.
                    tryItOutEnabled: false,
                    supportedSubmitMethods: [],
                  });
                };
              </script>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
